<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}UptimeLite{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <header class="border-b bg-white">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="font-bold text-lg">UptimeLite</a>
      <nav class="text-sm">
        {% if user %}
          <span class="text-slate-500 mr-3">{{ user.email }} ({{ user.plan }})</span>
          <a href="/dashboard" class="mr-3 text-blue-600">Dashboard</a>
          <a href="/logout" class="text-slate-500">Logout</a>
        {% else %}
          <a href="/login" class="mr-3 text-blue-600">Login</a>
          <a href="/register" class="text-blue-600">Sign up</a>
        {% endif %}
        <a href="/pricing" class="ml-3 text-slate-500">Pricing</a>
      </nav>
    </div>
  </header>
  <main class="max-w-5xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
