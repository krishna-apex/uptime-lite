{% extends "base.html" %}
{% block title %}Login — UptimeLite{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white p-6 rounded shadow-sm">
  <h1 class="text-xl font-bold mb-4">Login</h1>
  {% if error %}<p class="text-red-600 text-sm mb-3">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input name="email" type="email" placeholder="you@example.com" required class="w-full border rounded px-3 py-2 mb-3">
    <input name="password" type="password" placeholder="password" required class="w-full border rounded px-3 py-2 mb-3">
    <button class="w-full bg-blue-600 text-white py-2 rounded font-medium">Login</button>
  </form>
  <p class="text-sm text-slate-500 mt-3">New here? <a href="/register" class="text-blue-600">Sign up</a></p>
</div>
{% endblock %}
